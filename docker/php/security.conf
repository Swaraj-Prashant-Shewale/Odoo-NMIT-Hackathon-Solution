# ---------------------------------------------------------------------------
# Server-level hardening applied to every Dayflow container.
# ---------------------------------------------------------------------------

# Do not advertise the server version or operating system.
ServerTokens Prod
ServerSignature Off

# Only the verbs the application actually uses.
<Location "/">
    <LimitExcept GET POST PUT PATCH DELETE HEAD OPTIONS>
        Require all denied
    </LimitExcept>
</Location>

# TRACE can be abused to read headers the page script cannot see.
TraceEnable Off

# Reject requests that take an unreasonable time to send their headers.
Timeout 30
KeepAliveTimeout 5

<IfModule mod_headers.c>
    # The API and the client both set their own Content-Security-Policy; these
    # are the headers that are correct for every response either way.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always unset X-Powered-By
    Header always unset Server
</IfModule>

# Limit the size of an inbound request body (10 MB) so a single upload cannot
# exhaust memory. Individual endpoints enforce tighter limits of their own.
LimitRequestBody 10485760
