# ---------------------------------------------------------------------------
# Virtual host shared by every Dayflow container.
#
# All traffic is funnelled through public/index.php. Only the public directory
# is reachable over HTTP; application code, migrations and uploaded files live
# outside the document root and cannot be requested directly.
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    # ------------------------------------------------------------------
    # Pass the Authorization header through to the application.
    #
    # Apache withholds it by default, on the assumption that an auth module
    # will consume it. Nothing here uses Apache authentication: every
    # authenticated request in this platform carries a Bearer token that PHP
    # has to read. Without these two lines, every protected endpoint answers
    # 401 while looking perfectly configured.
    #
    # CGIPassAuth covers CGI and FastCGI; the SetEnvIf covers mod_php and
    # survives the internal rewrite to the front controller.
    # ------------------------------------------------------------------
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        CGIPassAuth On

        RewriteEngine On

        # Serve real files and directories as they are.
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Everything else is handled by the front controller.
        RewriteRule ^ index.php [L]
    </Directory>

    # Application source is never web accessible.
    <Directory /var/www/html/app>
        Require all denied
    </Directory>
    <Directory /var/www/html/database>
        Require all denied
    </Directory>
    <Directory /var/www/shared>
        Require all denied
    </Directory>
    <Directory /var/www/storage>
        Require all denied
    </Directory>

    # Dot-files (.env, .git) are refused outright.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Only PHP entry points may execute.
    <FilesMatch "\.(?i:sql|md|yml|yaml|log|sh|ini|lock|bak|swp|dist)$">
        Require all denied
    </FilesMatch>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined

    # Static assets are cached; generated pages never are.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                  "access plus 7 days"
        ExpiresByType application/javascript    "access plus 7 days"
        ExpiresByType image/png                 "access plus 30 days"
        ExpiresByType image/jpeg                "access plus 30 days"
        ExpiresByType image/svg+xml             "access plus 30 days"
        ExpiresByType font/woff2                "access plus 30 days"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json
    </IfModule>
</VirtualHost>
