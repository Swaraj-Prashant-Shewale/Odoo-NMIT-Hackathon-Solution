; ---------------------------------------------------------------------------
; Dayflow HRMS - PHP runtime configuration
; ---------------------------------------------------------------------------

; --- Error handling --------------------------------------------------------
; Errors go to the container log, never to the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; --- Information disclosure ------------------------------------------------
expose_php = Off

; --- Resource limits -------------------------------------------------------
memory_limit = 256M
max_execution_time = 30
max_input_time = 30
max_input_vars = 500
post_max_size = 12M
upload_max_filesize = 10M
max_file_uploads = 5

; --- Sessions --------------------------------------------------------------
; Only the web client starts a session; the backend services are stateless and
; never call session_start(), so these settings only ever affect the client.
; They make its cookie safe by default, so no individual call site has to
; remember to set them.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200
session.sid_length = 48
session.sid_bits_per_character = 6
session.name = DAYFLOW_SESSION

; --- Serialisation ---------------------------------------------------------
; Never unserialise class instances from untrusted input.
serialize_precision = -1

; --- Timezone --------------------------------------------------------------
date.timezone = UTC

; --- OPcache ---------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Source is bind-mounted during development, so changes must be picked up.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; --- Disabled functions ----------------------------------------------------
; The application never shells out. Removing these removes an entire class of
; remote code execution should any input ever reach an unexpected sink.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl
